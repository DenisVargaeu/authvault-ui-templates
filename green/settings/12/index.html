<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AuthVault — Settings 12 (Mobile Pill & Accordion) — Mobile-First Flat Notion Template" />
  <title>AuthVault — Settings 12 (Mobile Pill & Accordion)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div class="m-viewport">
    <div class="m-app">
      <header class="m-topbar">
        <a href="../../" class="m-brand">
          <span class="m-brand__icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
          <span>AuthVault</span>
          <span class="m-badge">Mobile 12</span>
        </a>
        <button type="button" id="theme-toggle" class="m-icon-btn" aria-label="Toggle theme" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </header>
      <main class="m-body"><h1 class="m-title">Preferences</h1><details class="m-accordion" open><summary><span>Profile</span><i class="fa-solid fa-chevron-down"></i></summary><div class="m-accordion__body"><div class="m-field"><label>Name</label><input class="m-input" value="Alex Mercer" /></div></div></details><details class="m-accordion" open><summary><span>Security</span><i class="fa-solid fa-chevron-down"></i></summary><div class="m-accordion__body"><div class="m-list"><div class="m-list-item"><div><strong>Two-Factor Auth</strong><small>Secondary code check</small></div><input type="checkbox" class="m-switch" checked /></div><div class="m-list-item"><div><strong>Device Alerts</strong><small>Notify on new login</small></div><input type="checkbox" class="m-switch" checked /></div><div class="m-list-item"><div><strong>Weekly Digest</strong><small>Monday summary email</small></div><input type="checkbox" class="m-switch" /></div></div></div></details></main><footer class="m-foot">&copy; 2026 DenisVargaeu &middot; v1.0.0</footer>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
