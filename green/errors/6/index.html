  <div id="toast-container" class="toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div class="center bg-dots" style="min-height:100vh;padding:24px;"><div style="width:100%;max-width:560px;background:var(--bg-card);border:1px solid var(--border-medium);border-radius:var(--radius-xl);overflow:hidden;"><header class="topbar" style="padding:10px 16px;background:var(--bg-sidebar);border-bottom:1px solid var(--border-subtle);"><span class="brand-link"><i class="fa-solid fa-terminal" style="color:var(--accent-text);"></i><span>authvault://error/404</span></span><button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light theme" aria-pressed="false">

  </span>

</button></header><div style="padding:28px;"><section class="err-inner"><span class="err-code">ERROR 404</span><h1>Route not resolved.</h1><p>Diagnostic trace: GET /unknown-route returned status 404.</p><div class="actions"><a href="../../" class="btn-primary"><i class="fa-solid fa-arrow-left"></i><span>Template Hub</span></a><a href="../../dashboard/1/" class="btn-outline">Dashboard</a><a href="../../login/1/" class="btn-outline">Sign In</a></div></section></div></div></div>
