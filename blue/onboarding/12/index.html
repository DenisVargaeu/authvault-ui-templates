<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AuthVault — Onboarding 12 (Mobile Pill & Accordion) — Mobile-First Flat Notion Template" />
  <title>AuthVault — Onboarding 12 (Mobile Pill & Accordion)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div class="m-viewport">
    <div class="m-app">
      <header class="m-topbar">
        <a href="../../" class="m-brand">
          <span class="m-brand__icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
          <span>AuthVault</span>
          <span class="m-badge">Mobile 12</span>
        </a>
        <button type="button" id="theme-toggle" class="m-icon-btn" aria-label="Toggle theme" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </header>
      <main class="m-body"><div class="m-pill-strip" data-pill-group><button type="button" class="m-pill is-active" data-target="s1">01 Name</button><button type="button" class="m-pill" data-target="s2">02 Team</button><button type="button" class="m-pill" data-target="s3">03 Launch</button></div><div class="m-card" data-panel="s1"><h1 class="m-title">Workspace Name</h1><div class="m-field"><label>Workspace Name</label><input class="m-input" value="Studio Espresso" /></div><div class="m-field"><label>Your Role</label><input class="m-input" value="Product Designer" /></div></div><div class="m-card" data-panel="s2" hidden><h1 class="m-title">Team Size</h1><div class="m-list"><div class="m-list-item"><strong>Solo (1)</strong><span class="m-tag">Selected</span></div><div class="m-list-item"><strong>Small Team (2-10)</strong></div></div></div><div class="m-card" data-panel="s3" hidden><h1 class="m-title">Ready!</h1><a href="../../dashboard/12/" class="m-btn m-btn--primary">Open Dashboard</a></div></main><footer class="m-foot">&copy; 2026 DenisVargaeu &middot; v1.0.0</footer>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
