<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AuthVault — Login 12 (Mobile Pill & Accordion) — Mobile-First Flat Notion Template" />
  <title>AuthVault — Login 12 (Mobile Pill & Accordion)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>
  <div class="m-viewport">
    <div class="m-app">
      <header class="m-topbar">
        <a href="../../" class="m-brand">
          <span class="m-brand__icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
          <span>AuthVault</span>
          <span class="m-badge">Mobile 12</span>
        </a>
        <button type="button" id="theme-toggle" class="m-icon-btn" aria-label="Toggle theme" aria-pressed="false">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </header>
      <main class="m-body"><div class="m-pill-strip" data-pill-group><button type="button" class="m-pill is-active" data-target="signin">Sign In</button><button type="button" class="m-pill" data-target="reg">Register</button><button type="button" class="m-pill" data-target="rec">Recovery</button></div><div class="m-card" data-panel="signin"><h1 class="m-title">Welcome back!</h1><form data-demo-form data-demo-msg="Simulated mobile sign-in succeeded." style="display:flex;flex-direction:column;gap:12px;">
          <div class="m-field"><label for="m-email">Email</label><input id="m-email" class="m-input" type="email" placeholder="name@example.com" required /></div>
          <div class="m-field"><label for="m-pass">Password</label><input id="m-pass" class="m-input" type="password" placeholder="Enter password" required /></div>
          <button type="submit" class="m-btn m-btn--primary"><span>Sign In</span><i class="fa-solid fa-arrow-right"></i></button>
          <button type="button" class="m-btn m-btn--outline" data-demo-toast="Google sign-in is demo only."><i class="fa-brands fa-google"></i><span>Continue with Google</span></button>
        </form></div><div class="m-card" data-panel="reg" hidden><h1 class="m-title">Create Account</h1><form data-demo-form data-demo-msg="Simulated account created." style="display:flex;flex-direction:column;gap:12px;"><div class="m-field"><label>Name</label><input class="m-input" type="text" placeholder="Alex Mercer" required /></div><div class="m-field"><label>Email</label><input class="m-input" type="email" placeholder="name@example.com" required /></div><button type="submit" class="m-btn m-btn--primary">Create Account</button></form></div><div class="m-card" data-panel="rec" hidden><h1 class="m-title">Reset Password</h1><form data-demo-form data-demo-msg="Reset link simulated." style="display:flex;flex-direction:column;gap:12px;"><div class="m-field"><label>Email</label><input class="m-input" type="email" placeholder="name@example.com" required /></div><button type="submit" class="m-btn m-btn--primary">Send Link</button></form></div></main><footer class="m-foot">&copy; 2026 DenisVargaeu &middot; v1.0.0</footer>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
